<svg xmlns="http://www.w3.org/2000/svg" width="980" height="220" viewBox="0 0 980 220" role="img" aria-labelledby="title desc">
<title id="title">Notion desktop clipboard bridge</title>
<desc id="desc">Page API clipboard.write goes through the preload ipcRenderer.invoke on channel notion:clipboard:write, then the main-process ipcMain.handle checks the sender and calls Electron clipboard.write.</desc>
<rect width="980" height="220" rx="16" fill="#fffcf7"/>
<text x="24" y="36" font-family="Georgia, serif" font-size="18" fill="#12131a">Clipboard bridge inside the desktop package</text>
<text x="24" y="58" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#6b7080">One channel on both sides: notion:clipboard:write</text>
<g font-family="ui-sans-serif, system-ui, sans-serif">
<rect x="24" y="78" width="210" height="112" rx="12" fill="#fff" stroke="#ddd4c4"/>
<text x="40" y="104" font-size="11" fill="#c43c24" font-weight="700">01 · PAGE API</text>
<text x="40" y="130" font-size="13" fill="#12131a">__electronApi</text>
<text x="40" y="150" font-size="13" fill="#12131a">.clipboard.write</text>
<rect x="250" y="78" width="210" height="112" rx="12" fill="#fff" stroke="#ddd4c4"/>
<text x="266" y="104" font-size="11" fill="#c43c24" font-weight="700">02 · PRELOAD</text>
<text x="266" y="130" font-size="13" fill="#12131a">ipcRenderer.invoke</text>
<text x="266" y="150" font-size="12" fill="#3c4050">channel + arguments</text>
<rect x="476" y="78" width="230" height="112" rx="12" fill="#fff" stroke="#ddd4c4"/>
<text x="492" y="104" font-size="11" fill="#c43c24" font-weight="700">03 · MAIN</text>
<text x="492" y="130" font-size="13" fill="#12131a">ipcMain.handle</text>
<text x="492" y="150" font-size="12" fill="#3c4050">isNotionWebContents</text>
<rect x="722" y="78" width="234" height="112" rx="12" fill="#fff" stroke="#ddd4c4"/>
<text x="738" y="104" font-size="11" fill="#c43c24" font-weight="700">04 · CLIPBOARD</text>
<text x="738" y="130" font-size="13" fill="#12131a">clipboard.write</text>
<text x="738" y="150" font-size="12" fill="#3c4050">text and HTML</text>
</g>
<path d="M234 134 H250 M460 134 H476 M706 134 H722" stroke="#2958f0" stroke-width="2" fill="none"/>
</svg>
