<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Architecture hypothesis (public signals): client to feed ranking path</title>
  <desc id="d">Falsifiable community diagram. Public client observes public API edges; x-algorithm is a published open-source slice for For You ranking — not a claim of full system source. Authorized/public only.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c9a46a"/></marker>
    <style>
      .box { fill:#141824; stroke:#2a3144; stroke-width:1.5; rx:12; }
      .pub { stroke:#5b7cfa; }
      .hyp { stroke:#c9a46a; stroke-dasharray:5 4; }
      .t { font:600 14px DM Sans, system-ui, sans-serif; fill:#e8ecf7; }
      .s { font:12px DM Sans, system-ui, sans-serif; fill:#9aa3b8; }
      .lab { font:700 11px JetBrains Mono, monospace; fill:#c9a46a; letter-spacing:0.04em; }
    </style>
  </defs>
  <rect width="960" height="520" fill="#0c0e14"/>
  <text x="32" y="36" class="lab">HYPOTHESIS v1 · PUBLIC / AUTHORIZED SIGNALS ONLY</text>
  <text x="32" y="58" class="s">Not a scanner. Not a claim of private backends. See rea.run/compliance/</text>

  <rect class="box pub" x="40" y="100" width="180" height="88"/>
  <text x="56" y="136" class="t">Public client</text>
  <text x="56" y="158" class="s">web / mobile UI</text>
  <text x="56" y="176" class="s">observable UX only</text>

  <rect class="box pub" x="280" y="100" width="200" height="88"/>
  <text x="296" y="136" class="t">Public API edge</text>
  <text x="296" y="158" class="s">documented / client-</text>
  <text x="296" y="176" class="s">visible requests</text>

  <rect class="box hyp" x="560" y="70" width="220" height="70"/>
  <text x="576" y="100" class="t">Candidate retrieval?</text>
  <text x="576" y="120" class="s">hypothesis boundary</text>

  <rect class="box pub" x="560" y="170" width="220" height="90"/>
  <text x="576" y="206" class="t">For You ranking</text>
  <text x="576" y="226" class="s">partial OSS signal:</text>
  <text x="576" y="244" class="s">xai-org/x-algorithm</text>

  <rect class="box hyp" x="280" y="280" width="200" height="80"/>
  <text x="296" y="314" class="t">Auth / session?</text>
  <text x="296" y="334" class="s">public flows only</text>

  <rect class="box hyp" x="560" y="300" width="220" height="80"/>
  <text x="576" y="334" class="t">Other surfaces</text>
  <text x="576" y="354" class="s">DMs, ads, search…</text>
  <text x="576" y="372" class="s">still mostly closed</text>

  <line x1="220" y1="144" x2="280" y2="144" stroke="#c9a46a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="130" x2="560" y2="105" stroke="#c9a46a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="155" x2="560" y2="200" stroke="#5b7cfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="188" x2="380" y2="280" stroke="#c9a46a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <line x1="670" y1="260" x2="670" y2="300" stroke="#c9a46a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <text x="32" y="430" class="s">Legend: solid blue border = public/citable · dashed gold = falsifiable hypothesis (not proven)</text>
  <text x="32" y="454" class="s">Open source ≠ everything open. x-algorithm covers a published For You slice; many products remain observation targets via public signals only.</text>
  <text x="32" y="490" class="lab">CC BY 4.0 community diagram · rea.run Life Process / arch</text>
</svg>
